<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith.io | Session Logs</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="history.css" />
</head>
<body onload="loadHistory()">

    <div id="bubble-container">
        <div class="bubble" id="b1"></div>
        <div class="bubble" id="b2"></div>
        <div class="bubble" id="b3"></div>
        <div class="bubble" id="b4"></div>
        <div class="bubble" id="b5"></div>
        <div class="bubble" id="b6"></div>
        <div class="bubble" id="b7"></div>
        <div class="bubble" id="b8"></div>
        <div class="bubble" id="b9"></div>
        <div class="bubble" id="b10"></div>
    </div>

    <nav class="meta-nav">
        <div class="nav-left">
            <span class="nav-link">Global Ranks</span>
            <span class="nav-link">Rewards</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Zenith Protocol</a></li>
            <li><a href="history.html" class="active">History</a></li>
            <li><a href="#">Rank: Admin</a></li>
        </ul>
        <div class="nav-right">
            <span class="player-count">● 1,240 Online</span>
            <button class="upgrade-btn">Pricing</button>
        </div>
    </nav>

    <main class="dashboard">
        <section class="focus-card">
            <div class="left-panel">
                <h1 id="status">SESSION LOGS</h1>
                <div class="history-table-container">
                    <table id="history-table">
                        <thead>
                            <tr>
                                <th>TASK</th>
                                <th>DURATION</th>
                                <th>DATE</th>
                            </tr>
                        </thead>
                        <tbody id="history-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <span>© 2026 Zenith.io | All Rights Reserved</span>
    </footer>

    <script src="history.js"></script>
</body>
</html>
