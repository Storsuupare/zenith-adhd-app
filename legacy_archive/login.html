<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith | Identity Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    </head>
<body class="auth-body">

    <div id="bubble-container">
        <div id="b1" class="bubble"></div>
        <div id="b2" class="bubble"></div>
        <div id="b3" class="bubble"></div>
        <div id="b4" class="bubble"></div>
        <div id="b5" class="bubble"></div>
        <div id="b6" class="bubble"></div>
        <div id="b7" class="bubble"></div>
        <div id="b8" class="bubble"></div>
        <div id="b9" class="bubble"></div>
        <div id="b10" class="bubble"></div>
    </div>

    <div class="login-terminal">
        <div class="auth-header">
            <i class="fas fa-user-astronaut"></i>
            <h2 class="glitch-text" style="font-size: 1.5rem; letter-spacing: 5px;">ACCESS</h2>
        </div>

        <form onsubmit="handleAuth(event)">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" placeholder="EMAIL_IDENTITY" class="zenith-input" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="SECURE_PASSCODE" class="zenith-input" required>
            </div>

            <div class="auth-options">
                <label><input type="checkbox"> REMEMBER_ID</label>
                <a href="#" class="auth-link">FORGOT_PASS?</a>
            </div>

            <button type="submit" class="btn-primary pulse-animation" style="padding: 15px;">INITIALIZE_SESSION</button>
        </form>

        <p style="font-size: 0.6rem; margin-top: 25px; color: rgba(255,255,255,0.3); letter-spacing: 1px;">
            NEW OPERATOR? <a href="#" class="auth-link">REGISTER_IDENTITY</a>
        </p>

        <div style="margin-top: 20px;">
            <a href="index.html" class="back-link" style="font-size: 0.6rem;">← ABORT_ACCESS</a>
        </div>
    </div>

    <script>
        function handleAuth(event) {
            event.preventDefault();
            const btn = document.querySelector('.btn-primary');
            btn.innerText = "VERIFYING...";
            btn.disabled = true;

            // Stage 2: Simulating server handshake
            setTimeout(() => {
                btn.innerText = "ACCESS_GRANTED";
                btn.style.background = "#fff";
                btn.style.color = "#000";
                
                setTimeout(() => {
                    // Redirect back to main dashboard
                    window.location.href = "index.html?auth=success";
                }, 1000);
            }, 2000);
        }
    </script>
</body>
</html>
