<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zenith</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="ambient-container" id="ambient-bg">
      <div id="b1" class="bubble"></div>
      <div id="b2" class="bubble"></div>
      <div id="b3" class="bubble"></div>
      <div id="b4" class="bubble"></div>
      <div id="b5" class="bubble"></div>
      <div id="b6" class="bubble"></div>
      <div id="b7" class="bubble"></div>
      <div id="b8" class="bubble"></div>
      <div id="b9" class="bubble"></div>
      <div id="b10" class="bubble"></div>
    </div>

    <nav class="meta-nav">
      <div class="nav-left">
        <span class="nav-link">Global Ranks</span>
        <span class="nav-link">Rewards</span>
      </div>

      <ul class="nav-links">
        <li><a href="history.html" class="active">History</a></li>
        <li><a href="#">Rank: Admin</a></li>
        <li>
          <div class="auth-node">
            <div class="user-avatar">
              <i class="fas fa-user-astronaut"></i>
              <span class="status-dot"></span>
            </div>
            <span class="login-label"><a href="login.html">LOG IN</a></span>
          </div>
        </li>
      </ul>

      <div class="nav-right">
        <span class="player-count">● 1,240 Online</span>
        <button class="upgrade-btn"><a href="pricing.html">Pricing</a></button>
      </div>
    </nav>

    <header class="xp-container">
      <div class="level-header">
        <span id="rank-title">Kinetic</span>
        <span id="level-display">Level 1</span>
      </div>
      <div class="xp-track">
        <div id="xp-bar-fill"></div>
      </div>
      <div class="xp-stats">
        <span id="xp-current">0</span> / <span id="xp-required">100</span> XP
      </div>

      <div class="stat-item">
        <span class="stat-label">TOTAL XP EARNED</span>
        <span id="lifetime-xp" class="stat-value">0</span>
        <span class="xp-unit">XP</span>

        <div class="medal-case">
          <div
            class="medal locked"
            id="medal-spark"
            title="The Spark: Earn 500 XP">
            ⚡
          </div>
          <div
            class="medal locked"
            id="medal-survivor"
            title="The Proud Survivor: 3 Day Streak">
            🔥
          </div>
          <div
            class="medal locked"
            id="medal-titan"
            title="The Zenith: Earn 5,000 XP">
            👑
          </div>
        </div>
      </div>
    </header>

    <main class="dashboard">
      <section class="focus-card">
        <div class="left-panel">
          <input
            type="text"
            id="task-input"
            placeholder="What are we focusing on?" />

          <div class="daily-goal-container">
            <div class="goal-info">
              <span>DAILY GOAL</span>
              <span id="goal-percentage">0%</span>
            </div>
            <div class="goal-bar-bg">
              <div id="goal-bar-fill"></div>
            </div>
          </div>

          <div class="timer-container">
            <svg class="timer-svg" viewBox="0 0 100 100">
              <circle class="timer-path-gray" cx="50" cy="50" r="45"></circle>
              <circle
                id="timer-path-remaining"
                class="timer-path-remaining"
                cx="50"
                cy="50"
                r="45"></circle>
            </svg>
            <span id="timer">00:00</span>
          </div>

          <div class="presets">
            <button class="preset-btn" onclick="setTime(10)">10:00</button>
            <button class="preset-btn" onclick="setTime(25)">25:00</button>
            <button class="preset-btn" onclick="setTime(45)">45:00</button>
            <button class="preset-btn" onclick="setTime(60)">60:00</button>
            <button class="preset-btn" onclick="setTime(90)">90:00</button>
          </div>
        </div>

        <button id="action-btn">START THE GRIND!</button>

        <div id="mission-hud">
          <div class="hud-line"></div>
          <div class="hud-content">
            <span class="label">CURRENT OBJECTIVE:</span>
            <span id="active-task-name">WAITING FOR INPUT...</span>
          </div>
          <div class="hud-reward">
            <span class="xp-potential">+0 XP</span>
            <button id="abort-btn" onclick="abortMission()">
              ABORT PROTOCOL
            </button>
          </div>
        </div>
      </section>
    </main>

    <div id="save-overlay" class="hidden">
      <div class="save-modal">
        <h2>SESSION ASCENDED</h2>
        <p>+<span id="earned-xp">0</span> XP</p>
        <div class="modal-xp-container">
          <div id="modal-xp-fill" class="xp-bar-fill-modal"></div>
        </div>
        <button id="continue-btn" onclick="closeModal()">CONTINUE</button>
      </div>
    </div>

    <footer class="app-footer">
      <span>© 2026 Zenith.io | All Rights Reserved</span>
    </footer>

    <script type="module" src="dist/app.js"></script>
  </body>
</html>
