<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Preconnect to Google Fonts — shaves ~100-300ms off font load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical Inter font weights to eliminate FOUT/FOIT -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" />

    <!-- Critical CSS inlined to prevent loading-screen layout shift -->
    <style>
      /* Prevent FOUC & reserve viewport space before JS hydrates */
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #030712;
        -webkit-font-smoothing: antialiased;
      }
      /* Loading screen — exact match to App.css to prevent CLS on swap */
      #root:empty::before {
        content: "Loading Zenith Engine…";
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;

        font-family: "Inter", system-ui, sans-serif;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        background: #050508;
      }
    </style>

    <title>Zenith</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
